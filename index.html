<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monopoly TG Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .active { display: flex !important; }

    /* 1. Экран авторизации */
    #auth-screen {
      background-image: url('https://raw.githubusercontent.com/ATUMY/monopoly_go/main/assets/icon_start.png');
    }

    /* 2. Экран игровой комнаты */
    #room-screen {
      background-image: url('https://raw.githubusercontent.com/ATUMY/monopoly_go/main/assets/icon_roomfons.png');
    }

    /* Блок приветствия (карточка + кнопка под ней) */
    .hello-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Небольшая карточка приветствия по центру */
    .hello-card {
      width: 320px;
      height: 240px;
      background: url('https://raw.githubusercontent.com/ATUMY/monopoly_go/main/assets/icon_hello1.png') no-repeat center center;
      background-size: contain;
    }

    .input-field {
      width: 80%;
      max-width: 300px;
      padding: 14px 18px;
      font-size: 18px;
      border: 2px solid #ffffff;
      border-radius: 12px;
      outline: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 15px;
    }

    .btn-red {
      width: 80%;
      max-width: 300px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background-color: #e74c3c;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-red:active {
      background-color: #c0392b;
      transform: scale(0.98);
    }

    .btn-under-card {
      width: 220px;
      padding: 12px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- 1. Экран входа -->
  <div id="auth-screen" class="screen active">
    <input type="text" id="username-input" class="input-field" placeholder="Введите имя..." maxlength="15">
    <button class="btn-red" id="btn-enter-id">ВОЙТИ</button>
  </div>

  <!-- 2. Игровая комната с карточкой и кнопкой ПОД НЕЙ -->
  <div id="room-screen" class="screen">
    <div id="hello-modal" class="hello-container">
      <div class="hello-card"></div>
      <button class="btn-red btn-under-card" id="btn-start-id">НАЧАТЬ ИГРУ</button>
    </div>
  </div>

  <script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Подключение Supabase
    const SUPABASE_URL = 'https://lfqkojfgkgrzvcrritpd.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcWtvamZna2dyenZjcnJpdHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjYzNzYsImV4cCI6MjEwMTQwMjM3Nn0.VAgSdmfH-Gke95a_sNv7hvs2XhPNWAs9CRTBIuLVfFc'; 
    
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Подстановка имени из TG
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        const input = document.getElementById('username-input');
        if (input && user.first_name) {
          input.value = user.first_name;
        }
      }

      // Кнопки
      document.getElementById('btn-enter-id').addEventListener('click', enterGame);
      document.getElementById('btn-start-id').addEventListener('click', startGame);
    });

    function enterGame() {
      const input = document.getElementById('username-input');
      const name = input ? input.value.trim() : '';
      
      if (!name) {
        alert('Пожалуйста, введите имя!');
        return;
      }
      
      localStorage.setItem('monopoly_user_name', name);

      // Переход в комнату
      document.getElementById('auth-screen').classList.remove('active');
      document.getElementById('room-screen').classList.add('active');
    }

    function startGame() {
      // Скрываем блок приветствия (карточку + кнопку под ней)
      const modal = document.getElementById('hello-modal');
      if (modal) {
        modal.style.display = 'none';
      }
    }
  </script>
</body>
</html>
