<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Monopoly Game</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .screen.active {
      display: flex;
    }

    /* Экран авторизации */
    #auth-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #2c3e50 0%, #000 100%);
      z-index: 10;
    }

    .auth-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 80%;
      max-width: 320px;
      text-align: center;
    }

    .auth-box input {
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
      text-align: center;
    }

    .auth-box button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #27ae60;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* Игровая комната */
    #room-screen {
      background: #1a1a24;
      position: relative;
      overflow: hidden;
    }

    /* Падающие листочки и сакура на фоне */
    .leaves-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -40px;
      opacity: 0.8;
      animation: fall linear infinite;
    }

    .leaf.sakura {
      width: 14px;
      height: 14px;
      background: #ffb7c5;
      border-radius: 10px 0 10px 0;
      box-shadow: 0 0 5px rgba(255, 183, 197, 0.5);
    }

    .leaf.green {
      width: 16px;
      height: 10px;
      background: #2ecc71;
      border-radius: 12px 0 12px 0;
      box-shadow: 0 0 5px rgba(46, 204, 113, 0.4);
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) rotate(720deg) translateX(50px);
        opacity: 0;
      }
    }

    /* Верхняя и нижняя панели */
    .top-bar, .bottom-bar {
      position: absolute;
      left: 0;
      width: 100%;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .top-bar.active-bar, .bottom-bar.active-bar {
      opacity: 1;
      pointer-events: auto;
    }

    .top-bar { top: 0; }
    .bottom-bar { bottom: 0; }

    .user-info, .balance-badge {
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 18px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: bold;
      backdrop-filter: blur(5px);
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px 16px;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    /* Игровое поле */
    .board-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      width: 90vw;
      height: 90vw;
      max-width: 420px;
      max-height: 420px;
      background: #2c3e50;
      border-radius: 20px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      z-index: 2;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
    }

    .board-container.active {
      opacity: 1;
    }

    .board-container.zoomed {
      transform: translate(-50%, -50%) scale(1.25);
    }

    /* Кнопка кубика */
    .dice-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      cursor: pointer;
      z-index: 3;
    }

    .dice-btn img {
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
    }

    .dice-btn img.rolling {
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Торнадо карточек (Рулетка) */
    .cards-tornado {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 8;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cards-tornado.active {
      opacity: 1;
      pointer-events: auto;
    }

    .tornado-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      transform: translate(-50%, -50%);
    }

    /* Карточки в торнадо */
    .property-card {
      position: absolute;
      width: 100px;
      height: 140px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      top: -70px;
      left: -50px;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
    }

    .tornado-inner.spinning .property-card {
      animation: orbit 1.5s infinite linear;
    }

    .property-card.card-pos-0 { transform: translate(-120px, -60px) rotate(-10deg); }
    .property-card.card-pos-1 { transform: translate(20px, -60px) rotate(10deg); }
    .property-card.card-pos-2 { transform: translate(-120px, 40px) rotate(5deg); }
    .property-card.card-pos-3 { transform: translate(20px, 40px) rotate(-5deg); }

    .tornado-inner.stopped .property-card:not(.final-selected) {
      opacity: 0;
      transform: scale(0.5);
    }

    .tornado-inner.stopped .property-card.final-selected {
      transform: translate(-50px, -70px) scale(1.3);
      z-index: 10;
    }

    /* Пустые карточки недвижимости */
    .property-card-header {
      height: 35%;
      width: 100%;
    }

    .property-card-body {
      height: 65%;
      width: 100%;
      background: #fff;
    }

    /* Карточки ШАНС */
    .chance-card-content {
      padding: 10px;
      text-align: center;
      color: #333;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chance-title {
      font-weight: bold;
      color: #e74c3c;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .chance-desc {
      font-size: 10px;
      line-height: 1.2;
    }

    /* Кнопки действий карточек */
    .card-action-btns {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 15px;
      z-index: 9;
    }

    .card-action-btns.active {
      display: flex;
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .btn-buy { background: #2ecc71; }
    .btn-cancel { background: #e74c3c; }
    .btn-ok { background: #3498db; }

    /* Модальные окна */
    .modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 20;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #242530;
      width: 85%;
      max-width: 350px;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .modal-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-btn {
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #34495e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
      margin-top: 15px;
    }

    .inventory-card {
      height: 80px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .inventory-card-header {
      height: 30%;
    }

    .inventory-card-body {
      height: 70%;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="auth-screen" class="screen active">
    <form id="auth-form" class="auth-box">
      <h2>Монополия</h2>
      <input type="text" id="username-input" placeholder="Введите имя..." required>
      <button type="button" id="btn-enter-id">Войти в игру</button>
    </form>
  </div>

  <!-- Игровая комната -->
  <div id="room-screen" class="screen">
    <!-- Лепестки и листья на фоне -->
    <div class="leaves-container" id="leaves-container"></div>

    <!-- Верхняя панель -->
    <div class="top-bar" id="top-bar-el">
      <div class="user-info" id="header-user-name">Игрок</div>
      <div class="balance-badge" id="balance-display">1500 €</div>
    </div>

    <!-- Игровое поле -->
    <div class="board-container" id="board-container">
      <div class="dice-btn" id="btn-dice-id">
        <img src="https://cdn-icons-png.flaticon.com/512/0/154.png" id="dice-img-id" alt="Кубик">
      </div>
    </div>

    <!-- Торнадо рулетки -->
    <div class="cards-tornado" id="cards-tornado">
      <div class="tornado-inner" id="tornado-inner"></div>
    </div>

    <!-- Кнопки покупка/отмена -->
    <div class="card-action-btns" id="card-action-btns">
      <button class="action-btn btn-buy" id="btn-buy-property">Купить</button>
      <button class="action-btn btn-cancel" id="btn-cancel-property">Отмена</button>
      <button class="action-btn btn-ok" id="btn-ok-property" style="display: none;">OK</button>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-bar" id="bottom-bar-el">
      <button class="control-btn" id="btn-bank-id">Банк</button>
      <button class="control-btn" id="btn-active-id">Активы</button>
    </div>
  </div>

  <!--Приветственное окно-->
  <div class="modal active" id="hello-modal">
    <div class="modal-content">
      <div class="modal-title">Добро пожаловать!</div>
      <p>Готовы начать игру?</p>
      <div class="modal-btns">
        <button class="modal-btn" id="btn-start-id" style="background: #27ae60;">Начать</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно Банка -->
  <div class="modal" id="bank-modal">
    <div class="modal-content">
      <div class="modal-title">Банк</div>
      <div class="modal-btns">
        <button class="modal-btn" id="btn-get-credit">Взять кредит (+1000 €)</button>
        <button class="modal-btn" id="btn-repay-credit">Погасить кредит (-1000 €)</button>
        <button class="modal-btn" id="btn-bank-back">Назад</button>
      </div>
    </div>
  </div>

  <!-- Модальные окна успеха Банка -->
  <div class="modal" id="credit-plus-modal">
    <div class="modal-content">
      <div class="modal-title">Кредит одобрен!</div>
      <p>Вам начислено +1000 €</p>
      <div class="modal-btns">
        <button class="modal-btn" id="btn-credit-plus-ok">Отлично</button>
      </div>
    </div>
  </div>

  <div class="modal" id="credit-minus-modal">
    <div class="modal-content">
      <div class="modal-title">Кредит погашен</div>
      <p>С вашего счета списано -1000 €</p>
      <div class="modal-btns">
        <button class="modal-btn" id="btn-credit-minus-ok">ОК</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно Активов -->
  <div class="modal" id="active-modal">
    <div class="modal-content">
      <div class="modal-title">Ваши активы</div>
      <div class="inventory-grid" id="active-cards-list"></div>
      <div class="modal-btns">
        <button class="modal-btn" id="btn-active-back">Назад</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const SUPABASE_URL = 'https://lfqkojfgkgrzvcrritpd.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcWtvamZna2dyenZjcnJpdHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjYzNzYsImV4cCI6MjEwMTQwMjM3Nn0.VAgSdmfH-Gke95a_sNv7hvs2XhPNWAs9CRTBIuLVfFc'; 

    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let playerBalance = 1500;
    let inventory = [];

    // Обычные карточки недвижимости (без имен, только цвета)
    const standardProperties = [
      { color: '#8B4513', type: 'property', price: 100 },
      { color: '#87CEEB', type: 'property', price: 150 },
      { color: '#FF69B4', type: 'property', price: 200 },
      { color: '#FFA500', type: 'property', price: 250 },
      { color: '#E74C3C', type: 'property', price: 300 },
      { color: '#F1C40F', type: 'property', price: 350 },
      { color: '#2ECC71', type: 'property', price: 400 },
      { color: '#2980B9', type: 'property', price: 450 },
      { color: '#111111', type: 'property', price: 500 }
    ];

    // Карточки "ШАНС"
    const chanceCardsData = [
      { text: "Продвижение до СТАРТА: Начисление +200 € и сброс круга.", change: 200 },
      { text: "Перелет в Нью-Йорк: Выпадение «Нью-Йорк» + 200 € за круг.", change: 200 },
      { text: "Вокзал 'Северный': Выпадение Вокзала 'Северный'.", change: 0 },
      { text: "Инвестиции: Дивиденды +150 €.", change: 150 },
      { text: "Банковский выбор: Выплата +50 €.", change: 50 },
      { text: "Бесплатный выход из Тюрьмы: Карточка в инвентарь.", change: 0 },
      { text: "Штрафные 3 шага: Списание -50 €.", change: -50 },
      { text: "Арест: Прямой переход в Тюрьму.", change: 0 },
      { text: "Капитальный ремонт: Заплатить -25 € за дом, -100 € за отель.", change: -50 },
      { text: "Превышение скорости: Штраф -15 €.", change: -15 },
      { text: "Оплата обучения: Штраф -150 €.", change: -150 },
      { text: "Благотворительность: Выплатить каждому игроку по -50 €.", change: -50 },
      { text: "Лотерея: Выигрыш +100 €.", change: 100 }
    ];

    // Генерация летающих листьев и сакуры на фоне
    function createBackgroundLeaves() {
      const container = document.getElementById('leaves-container');
      if (!container) return;
      container.innerHTML = '';

      const count = 25;
      for (let i = 0; i < count; i++) {
        const leaf = document.createElement('div');
        const isSakura = Math.random() > 0.4;
        leaf.className = `leaf ${isSakura ? 'sakura' : 'green'}`;
        
        leaf.style.left = `${Math.random() * 100}%`;
        leaf.style.animationDuration = `${5 + Math.random() * 7}s`;
        leaf.style.animationDelay = `${Math.random() * 5}s`;
        
        container.appendChild(leaf);
      }
    }

    function updateBalanceUI() {
      const balanceEl = document.getElementById('balance-display');
      if (balanceEl) balanceEl.textContent = playerBalance + ' €';
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }

    function enterGame() {
      const input = document.getElementById('username-input');
      const name = input ? input.value.trim() : '';
      if (!name) return;

      localStorage.setItem('monopoly_user_name', name);
      document.getElementById('header-user-name').textContent = name;

      document.getElementById('auth-screen').classList.remove('active');
      document.getElementById('room-screen').classList.add('active');

      triggerConfetti();
    }

    function startGame() {
      const modal = document.getElementById('hello-modal');
      if (modal) modal.style.display = 'none';

      document.getElementById('top-bar-el').classList.add('active-bar');
      document.getElementById('bottom-bar-el').classList.add('active-bar');

      const boardContainer = document.getElementById('board-container');
      boardContainer.classList.add('active');
    }

    function getRandomCardItem() {
      const isChance = Math.random() < 0.3;
      if (isChance) {
        const randomChance = chanceCardsData[Math.floor(Math.random() * chanceCardsData.length)];
        return { type: 'chance', data: randomChance };
      } else {
        const randomProp = standardProperties[Math.floor(Math.random() * standardProperties.length)];
        return { type: 'property', data: randomProp };
      }
    }

    function playCardsTornado() {
      const tornadoContainer = document.getElementById('cards-tornado');
      const tornadoInner = document.getElementById('tornado-inner');
      const actionBtns = document.getElementById('card-action-btns');
      const buyBtn = document.getElementById('btn-buy-property');
      const cancelBtn = document.getElementById('btn-cancel-property');
      const okBtn = document.getElementById('btn-ok-property');
      const boardContainer = document.getElementById('board-container');
      
      if (boardContainer) boardContainer.classList.add('zoomed');

      tornadoInner.innerHTML = '';
      tornadoInner.classList.remove('stopped');
      if (actionBtns) actionBtns.classList.remove('active');

      let selectedCards = [
        getRandomCardItem(),
        getRandomCardItem(),
        getRandomCardItem(),
        getRandomCardItem()
      ];

      let winningIndex = Math.floor(Math.random() * 4);
      let winningCard = selectedCards[winningIndex];

      window.currentWinningCard = winningCard;

      selectedCards.forEach((item, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = `property-card card-pos-${index}`;
        if (index === winningIndex) cardEl.classList.add('final-selected');

        let innerContent = '';
        if (item.type === 'chance') {
          innerContent = `
            <div class="property-card-body">
              <div class="chance-card-content">
                <div class="chance-title">ШАНС</div>
                <div class="chance-desc">${item.data.text}</div>
              </div>
            </div>
          `;
        } else {
          innerContent = `
            <div class="property-card-header" style="background-color: ${item.data.color};"></div>
            <div class="property-card-body"></div>
          `;
        }

        cardEl.innerHTML = innerContent;
        tornadoInner.appendChild(cardEl);
      });

      tornadoContainer.classList.add('active');
      tornadoInner.classList.add('spinning');

      setTimeout(() => {
        tornadoInner.classList.remove('spinning');
        tornadoInner.classList.add('stopped');
        triggerConfetti();

        if (winningCard.type === 'chance') {
          buyBtn.style.display = 'none';
          cancelBtn.style.display = 'none';
          okBtn.style.display = 'flex';
        } else {
          buyBtn.style.display = 'flex';
          cancelBtn.style.display = 'flex';
          okBtn.style.display = 'none';
        }

        if (actionBtns) actionBtns.classList.add('active');
      }, 2000);
    }

    function buyCurrentProperty() {
      const actionBtns = document.getElementById('card-action-btns');
      if (actionBtns) actionBtns.classList.remove('active');

      const selectedCardEl = document.querySelector('.property-card.final-selected');
      if (selectedCardEl && window.currentWinningCard) {
        inventory.push(window.currentWinningCard.data);

        setTimeout(() => {
          closeTornadoOverlay();
        }, 400);
      } else {
        closeTornadoOverlay();
      }
    }

    function handleCardActionResult() {
      if (window.currentWinningCard && window.currentWinningCard.type === 'chance') {
        const changeVal = window.currentWinningCard.data.change;
        if (changeVal !== 0) {
          playerBalance += changeVal;
          updateBalanceUI();
        }
      }
      closeTornadoOverlay();
    }

    function closeTornadoOverlay() {
      const tornadoContainer = document.getElementById('cards-tornado');
      const tornadoInner = document.getElementById('tornado-inner');
      const actionBtns = document.getElementById('card-action-btns');
      const boardContainer = document.getElementById('board-container');

      if (boardContainer) boardContainer.classList.remove('zoomed');
      if (actionBtns) actionBtns.classList.remove('active');
      if (tornadoContainer) tornadoContainer.classList.remove('active');
      if (tornadoInner) tornadoInner.classList.remove('stopped');
    }

    function openActiveModal() {
      const activeModal = document.getElementById('active-modal');
      const cardsList = document.getElementById('active-cards-list');
      cardsList.innerHTML = '';

      if (inventory.length === 0) {
        cardsList.innerHTML = '<div style="color: #888; grid-column: 1 / -1; margin-top: 20px; font-weight: bold; font-size: 13px;">Нет купленных карточек</div>';
      } else {
        inventory.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = 'inventory-card';

          if (item.color) {
            itemEl.innerHTML = `
              <div class="inventory-card-header" style="background-color: ${item.color};"></div>
              <div class="inventory-card-body"></div>
            `;
          } else {
            itemEl.innerHTML = `
              <div class="inventory-card-body" style="font-size: 8px; line-height: 1.1; padding: 4px; text-align: center;"><b>ШАНС</b><br>${item.text}</div>
            `;
          }
          cardsList.appendChild(itemEl);
        });
      }

      activeModal.classList.add('active');
    }

    // Запуск при загрузке DOM
    document.addEventListener('DOMContentLoaded', () => {
      createBackgroundLeaves();

      const input = document.getElementById('username-input');
      const enterBtn = document.getElementById('btn-enter-id');
      const authForm = document.getElementById('auth-form');

      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        if (input && user.first_name) {
          input.value = user.first_name;
        }
      }

      const doEnter = (e) => {
        if (e) e.preventDefault();
        enterGame();
      };

      if (enterBtn) {
        enterBtn.addEventListener('pointerdown', doEnter);
        enterBtn.addEventListener('click', doEnter);
      }

      if (authForm) {
        authForm.addEventListener('submit', doEnter);
      }

      if (input) {
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') doEnter(e);
        });
      }

      const btnStart = document.getElementById('btn-start-id');
      if (btnStart) btnStart.addEventListener('click', startGame);

      const bankModal = document.getElementById('bank-modal');
      const activeModal = document.getElementById('active-modal');
      const creditPlusModal = document.getElementById('credit-plus-modal');
      const creditMinusModal = document.getElementById('credit-minus-modal');

      const btnBank = document.getElementById('btn-bank-id');
      if (btnBank) btnBank.addEventListener('click', () => bankModal.classList.add('active'));

      const btnBankBack = document.getElementById('btn-bank-back');
      if (btnBankBack) btnBankBack.addEventListener('click', () => bankModal.classList.remove('active'));

      const btnActive = document.getElementById('btn-active-id');
      if (btnActive) btnActive.addEventListener('click', openActiveModal);

      const btnActiveBack = document.getElementById('btn-active-back');
      if (btnActiveBack) btnActiveBack.addEventListener('click', () => activeModal.classList.remove('active'));

      const btnGetCredit = document.getElementById('btn-get-credit');
      if (btnGetCredit) {
        btnGetCredit.addEventListener('click', () => {
          bankModal.classList.remove('active');
          playerBalance += 1000;
          updateBalanceUI();
          creditPlusModal.classList.add('active');
          triggerConfetti();
        });
      }

      const btnRepayCredit = document.getElementById('btn-repay-credit');
      if (btnRepayCredit) {
        btnRepayCredit.addEventListener('click', () => {
          bankModal.classList.remove('active');
          playerBalance -= 1000;
          updateBalanceUI();
          creditMinusModal.classList.add('active');
          triggerConfetti();
        });
      }

      const btnCreditPlusOk = document.getElementById('btn-credit-plus-ok');
      if (btnCreditPlusOk) btnCreditPlusOk.addEventListener('click', () => creditPlusModal.classList.remove('active'));

      const btnCreditMinusOk = document.getElementById('btn-credit-minus-ok');
      if (btnCreditMinusOk) btnCreditMinusOk.addEventListener('click', () => creditMinusModal.classList.remove('active'));

      const buyBtn = document.getElementById('btn-buy-property');
      const cancelBtn = document.getElementById('btn-cancel-property');
      const okBtn = document.getElementById('btn-ok-property');

      if (buyBtn) buyBtn.addEventListener('click', buyCurrentProperty);
      if (cancelBtn) cancelBtn.addEventListener('click', closeTornadoOverlay);
      if (okBtn) okBtn.addEventListener('click', handleCardActionResult);

      const diceBtn = document.getElementById('btn-dice-id');
      const diceImg = document.getElementById('dice-img-id');
      let isRolling = false;

      if (diceBtn && diceImg) {
        diceBtn.addEventListener('click', () => {
          if (isRolling) return; 
          isRolling = true;
          diceImg.classList.add('rolling');

          playCardsTornado();

          setTimeout(() => {
            diceImg.classList.remove('rolling');
            isRolling = false;
          }, 2000);
        });
      }
    });
  </script>
</body>
</html>
